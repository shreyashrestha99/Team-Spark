server:
  port: 8081

spring:
  application:
    name: Backend
  datasource:
    url: jdbc:postgresql://localhost:5432/Team Spark
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Schema is still changing, so every restart rebuilds it and DataInitializer reseeds.
      # Switch back to "update" once the schema settles and seed data should survive restarts.
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

