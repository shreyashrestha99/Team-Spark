server:
  port: 8081

spring:
  application:
    name: Backend
  datasource:
    url: jdbc:postgresql://localhost:5432/Team Spark
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Schema has settled, so keep data across restarts instead of rebuilding every time.
      # Use "create" only when an entity change needs the tables rebuilt from scratch.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

